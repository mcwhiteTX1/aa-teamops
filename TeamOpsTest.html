<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamOps — Dataverse connection test</title>
<style>
  body { font-family: sans-serif; background: #f4f3f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border-radius: 12px; padding: 40px; max-width: 480px; width: 90%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #5a5954; font-size: 14px; margin: 0 0 24px; }
  .btn { display: inline-block; background: #1a56db; color: #fff; padding: 10px 24px; border-radius: 8px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
  .result { margin-top: 24px; padding: 16px; border-radius: 8px; font-size: 13px; text-align: left; }
  .result.success { background: #f0fdf4; border: 1px solid #16a34a; color: #15803d; }
  .result.error { background: #fef2f2; border: 1px solid #dc2626; color: #dc2626; }
  .result.loading { background: #eff6ff; border: 1px solid #1a56db; color: #1a56db; }
  .row { background: #f4f3f0; border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-weight: 500; color: #1a1a18; }
</style>
</head>
<body>
<div class="card">
  <h1>TeamOps</h1>
  <p>Dataverse connection test — click the button to sign in with your Microsoft 365 account and load data from Dataverse.</p>
  <button class="btn" onclick="startAuth()">Sign in and load data</button>
  <div id="result"></div>
</div>

<script>
const TENANT_ID = '49793faf-eb3f-4d99-a0cf-aef7cce79dc1';
const CLIENT_ID = 'a481b622-8ab2-4c0a-82fd-bf77defd1ff1';
const INSTANCE = 'https://org1fbb3da1.crm.dynamics.com';
const TABLE = 'cr5c1_efforttests';
const REDIRECT = window.location.href.split('#')[0];

function showResult(type, html) {
  document.getElementById('result').innerHTML = `<div class="result ${type}">${html}</div>`;
}

function startAuth() {
  showResult('loading', 'Redirecting to Microsoft sign-in...');
  const authUrl = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize?` +
    `client_id=${CLIENT_ID}` +
    `&response_type=token` +
    `&redirect_uri=${encodeURIComponent(REDIRECT)}` +
    `&scope=${encodeURIComponent('https://org1fbb3da1.crm.dynamics.com/user_impersonation')}` +
    `&response_mode=fragment` +
    `&prompt=select_account`;
  window.location.href = authUrl;
}

async function handleToken() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  const error = params.get('error_description');

  if (error) {
    showResult('error', `Sign-in error: ${error}`);
    return;
  }

  if (!token) {
    return;
  }

  // Clean up URL
  history.replaceState(null, '', window.location.pathname);
  showResult('loading', 'Signed in! Loading data from Dataverse...');

  try {
    const url = `${INSTANCE}/api/data/v9.2/${TABLE}?$select=cr5c1_name&$top=10`;
    const r = await fetch(url, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/json',
        'OData-MaxVersion': '4.0',
        'OData-Version': '4.0'
      }
    });
    if (!r.ok) {
      const err = await r.text();
      showResult('error', `API error ${r.status}: ${err}`);
      return;
    }
    const data = await r.json();
    const rows = data.value;
    if (rows.length === 0) {
      showResult('success', '✓ Connected to Dataverse successfully! No rows in table yet.');
      return;
    }
    let html = `<strong>✓ Connection successful!</strong> Found ${rows.length} row(s):<br>`;
    rows.forEach(row => {
      html += `<div class="row">${row.cr5c1_name || '(no name)'}</div>`;
    });
    document.getElementById('result').innerHTML = `<div class="result success">${html}</div>`;
  } catch(e) {
    showResult('error', `Fetch failed: ${e.message}`);
  }
}

// Handle token on page load if returning from auth redirect
if (window.location.hash.includes('access_token') || window.location.hash.includes('error')) {
  handleToken();
}
</script>
</body>
</html>
